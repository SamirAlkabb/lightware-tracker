<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D0B09">
<title>Lightware TV</title>
<!--
  LIGHTWARE TV v2 — «الضوء وهو شغّال» / the light at work.

  ⚠ WHAT CHANGED FROM v1 (index.html, Jul 25) AND WHY. v1 floated a transparent
  studio cutout on an ink stage with an amber glow. It was handsome, and it was
  a catalogue page on a television. This one is built on the photographs of the
  fixtures ACTUALLY INSTALLED — the in-situ pass — because a showroom screen has
  one job a catalogue cannot do: show the customer the room, not the object.
  Samir, Aug 17: «make a new one with the premium photos we did, the installed
  ones.»

  ⚠ SMARTWARE IS ONE SEGMENT, NOT A PARADE. His condition was «no need for the
  smartware unless you are going to make something other than just showcasing
  the switches without being installed and without a concept». So the switches
  appear exactly once per loop, all wall-mounted, under a single idea — the same
  wall, a different decision — and never as a product list.

  FEEDS: dashboard_items (anon, read-only) + Supabase storage. No build step, no
  server. A scene lives at item-images/scenes*/ and a wall-mounted switch at
  item-images/lni/ — both ride in `gallery`, so the loop follows the catalogue
  and needs no list of its own.

  ON THE SCREEN: open the URL, go fullscreen, disable sleep. It handles the
  rest — hourly data refresh, a 04:00 reload, next-image preload only (a TV runs
  for weeks and must not grow), and a localStorage cache so a flaky line or a
  morning power cut still comes back to a full loop.
-->
<style>
  :root{ --ink:#0D0B09; --cream:#F2ECDF; --amber:#E8870B; --muted:#A79C8B; }
  @font-face{font-family:'Outfit';font-weight:100 900;font-display:swap;
    src:url('outfit-latin-wght-normal.woff2') format('woff2')}
  @font-face{font-family:'Plex Arabic';font-weight:600;font-display:swap;
    src:url('ibm-plex-sans-arabic-arabic-600-normal.woff2') format('woff2')}
  @font-face{font-family:'Plex Arabic';font-weight:400;font-display:swap;
    src:url('ibm-plex-sans-arabic-arabic-400-normal.woff2') format('woff2')}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);cursor:none}
  body{font-family:'Outfit',sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}

  /* ---- the stage: two layers that cross-fade, so nothing ever flashes ink ---- */
  .layer{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
  .layer.on{opacity:1}
  .layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform-origin:center;will-change:transform}
  /* ⚠ ONE transform on ONE element — a TV browser is a weak GPU and this loop
     runs for weeks. Everything else is opacity. */
  .layer.on img{animation:push 22s linear forwards}
  @keyframes push{from{transform:scale(1.04)}to{transform:scale(1.15)}}
  .layer.on.alt img{animation:pushb 22s linear forwards}
  @keyframes pushb{from{transform:scale(1.15) translate(1.2%,-1%)}
                   to{transform:scale(1.04) translate(0,0)}}

  /* the scrim: the caption has to be readable over a photograph we did not
     choose for its bottom third */
  .veil{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top, rgba(13,11,9,.92) 0%, rgba(13,11,9,.55) 22%,
                                rgba(13,11,9,0) 48%),
               linear-gradient(to bottom, rgba(13,11,9,.55) 0%, rgba(13,11,9,0) 26%)}

  /* ---- chrome ---- */
  .mark{position:absolute;top:4.4vmin;inset-inline-start:5vmin;z-index:8;
    font-family:'Outfit';font-weight:300;font-size:2.5vmin;letter-spacing:.42em;
    color:var(--cream);opacity:.92}
  .mark b{color:var(--amber);font-weight:300}

  .cap{position:absolute;bottom:6.5vmin;inset-inline-start:5vmin;z-index:6;
    max-width:64vw;text-align:start}
  .eyebrow{unicode-bidi:isolate;font-family:'Outfit';font-weight:400;font-size:1.9vmin;letter-spacing:.34em;
    text-transform:uppercase;color:var(--amber);margin-bottom:1.6vmin}
  .name{font-family:'Plex Arabic','Outfit',sans-serif;font-weight:600;font-size:5.6vmin;
    line-height:1.24;text-wrap:balance}
  .ref{font-family:'Outfit';font-weight:300;font-size:1.9vmin;letter-spacing:.2em;
    color:var(--muted);margin-top:1.5vmin;direction:ltr;text-align:start}
  /* the caption rides in on its own, a beat after the photo settles */
  .cap.hide{visibility:hidden}
  .cap>*{opacity:0;transform:translateY(1.4vmin);transition:opacity .9s ease,transform .9s ease}
  .cap.on>*{opacity:1;transform:none}
  .cap.on .name{transition-delay:.12s} .cap.on .ref{transition-delay:.24s}

  .qr{position:absolute;bottom:6.5vmin;inset-inline-end:5vmin;z-index:6;
    display:flex;align-items:center;gap:1.8vmin}
  .qr img{width:11vmin;height:11vmin;border-radius:1.2vmin;background:#fff;padding:.9vmin}
  .qr span{font-family:'Outfit';font-weight:300;font-size:1.8vmin;letter-spacing:.18em;
    color:var(--muted);direction:ltr}

  /* ---- title card: the loop needs a breath between runs of photographs ---- */
  .card{position:absolute;inset:0;z-index:7;opacity:0;transition:opacity 1.2s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8vmin;background:rgba(13,11,9,.82)}
  .card.on{opacity:1}
  .card .k{unicode-bidi:isolate;font-family:'Outfit';font-weight:400;font-size:2.1vmin;letter-spacing:.4em;
    text-transform:uppercase;color:var(--amber);margin-bottom:3vmin}
  .card .t{font-family:'Plex Arabic','Outfit',sans-serif;font-weight:600;font-size:7.4vmin;
    line-height:1.28;max-width:76vw;text-wrap:balance}
  .card .s{font-family:'Plex Arabic','Outfit',sans-serif;font-weight:400;font-size:2.7vmin;
    color:var(--muted);margin-top:3vmin;max-width:60vw;line-height:1.7}

  .boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;
    background:var(--ink);transition:opacity .8s ease}
  .boot.gone{opacity:0;pointer-events:none}
  .boot span{font-family:'Outfit';font-weight:300;font-size:2.4vmin;letter-spacing:.4em;
    color:var(--muted)}
</style>
</head>
<body>
  <div class="layer" id="a"><img alt=""></div>
  <div class="layer alt" id="b"><img alt=""></div>
  <div class="veil"></div>

  <div class="mark" dir="ltr">LIGHTWARE<b>.</b></div>
  <div class="cap" id="cap">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="name" id="name"></div>
    <div class="ref" id="ref"></div>
  </div>
  <div class="qr"><img src="qr.png" alt=""><span>lightwaresy.com</span></div>

  <div class="card" id="card">
    <div class="k" id="cardk"></div>
    <div class="t" id="cardt"></div>
    <div class="s" id="cards"></div>
  </div>

  <div class="boot" id="boot"><span>LIGHTWARE</span></div>

<script>
(function(){
'use strict';
var SB='https://ohprikkwnymjtcxzoylq.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocHJpa2t3bnltanRjeHpveWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDQ5MjQsImV4cCI6MjA5ODkyMDkyNH0.0nI52H8ZV6fuj948WGk-ZLDVSgIu9y59_9R2a_jZST0';
var HOLD=13000;            // one photograph on screen
var CARD=7000;             // one title card
var RUN=7;                 // photographs between title cards
var CACHE='lw_tv_v2';

var A=document.getElementById('a'), B=document.getElementById('b');
var cap=document.getElementById('cap');
var els={eyebrow:document.getElementById('eyebrow'),name:document.getElementById('name'),
         ref:document.getElementById('ref')};
var card=document.getElementById('card'), cardk=document.getElementById('cardk'),
    cardt=document.getElementById('cardt'), cards=document.getElementById('cards');

// ---- the loop's own words. Kept here, not in the data: they are the concept,
// and the concept is not a product attribute.
var CARDS=[
  {k:'LIGHTWARE · دمشق', t:'الضوء وهو شغّال.',
   s:'كل قطعة بتشوفها هون معروضة بصالتنا — تعال شوفها عالطبيعة قبل ما تقرر.'},
  {k:'التركيب', t:'منجيبها، منركّبها، ومنضمنها.',
   s:'من اختيار القطعة لتركيبها بمكانها — فريقنا بيمشي معك للآخر.'},
  {k:'المجموعة', t:'أرقى بيوت الإنارة بالعالم — تحت سقف واحد.',
   s:'Megaman · BTicino · LEDs C4 · Legrand · Simon Urmet · Orvibo'}
];
// ⚠ the one Smartware moment. Not a product list — an idea, over wall-mounted
// photographs only. Drops out of the loop by itself if no installed switch
// photo is in stock, which is the honest behaviour.
var SMART={k:'SMARTWARE', t:'نفس الحيط. قرار تاني.',
           s:'مفاتيح وشاشات وأنظمة ذكية — منركّبها ومنبرمجها لك.'};

function j(u,cb){ var x=new XMLHttpRequest(); x.open('GET',u,true);
  x.setRequestHeader('apikey',KEY); x.setRequestHeader('Authorization','Bearer '+KEY);
  x.onload=function(){ try{ cb(JSON.parse(x.responseText)); }catch(e){ cb(null); } };
  x.onerror=function(){ cb(null); }; x.send(); }

function pull(done){
  var out=[], from=0;
  (function page(){
    var x=new XMLHttpRequest();
    x.open('GET',SB+'/rest/v1/dashboard_items?select=code,name,latin_name,brand,gallery&qty=gt.0',true);
    x.setRequestHeader('apikey',KEY); x.setRequestHeader('Authorization','Bearer '+KEY);
    x.setRequestHeader('Range',from+'-'+(from+999));
    x.onload=function(){
      var p=[]; try{ p=JSON.parse(x.responseText)||[]; }catch(e){}
      out=out.concat(p);
      if(p.length===1000 && from<4000){ from+=1000; page(); } else done(out);
    };
    x.onerror=function(){ done(out); };
    x.send();
  })();
}

function build(rows){
  var scenes=[], walls=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i], g=r.gallery||[], s=null, w=null;
    for(var k=0;k<g.length;k++){
      if(typeof g[k]!=='string') continue;
      if(!s && g[k].indexOf('/item-images/scenes')>-1) s=g[k];
      if(!w && g[k].indexOf('/item-images/lni/')>-1)  w=g[k];
    }
    var item={code:r.code, name:(r.name||'').trim(),
              ref:(r.latin_name||'').trim(),
              brand:(r.brand&&/^[A-Za-z]/.test(r.brand))?r.brand:''};
    if(s){ item.src=s; scenes.push(item); }
    else if(w){ var c={}; for(var q in item) c[q]=item[q]; c.src=w; walls.push(c); }
  }
  return {scenes:shuffle(scenes), walls:shuffle(walls)};
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1));
  var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// ---- playback -------------------------------------------------------------
var data={scenes:[],walls:[]}, si=0, wi=0, shown=0, cardi=0, front=A, back=B, timer=null;

function preload(u){ if(!u) return; var im=new Image(); im.src=u; }

function paint(item, next){
  back.querySelector('img').src=item.src;
  els.eyebrow.textContent = item.brand ? item.brand : 'LIGHTWARE';
  els.name.textContent = item.name;
  // ⚠ the ref line earns its place or it goes: a spec soup like
  // «SW-2360 2*3W AC85-265V WW GREY BODY IP54» is unreadable at 3 metres, and a
  // ref the product NAME already contains is pure repetition.
  var rf = item.ref, nm = item.name.replace(/\s+/g,' ');
  if (rf.length > 22 || (rf && nm.toUpperCase().indexOf(rf.toUpperCase()) > -1)) rf = '';
  els.ref.textContent = rf;
  cap.classList.remove('on');
  back.classList.add('on'); front.classList.remove('on');
  var t=front; front=back; back=t;
  setTimeout(function(){ cap.classList.add('on'); }, 700);
  preload(next && next.src);
}

function showCard(c, after){
  cardk.textContent=c.k; cardt.textContent=c.t; cards.textContent=c.s;
  card.classList.add('on'); cap.classList.remove('on'); cap.classList.add('hide');
  setTimeout(function(){ card.classList.remove('on'); cap.classList.remove('hide'); after(); }, CARD);
}

function step(){
  if(!data.scenes.length){ timer=setTimeout(step, 5000); return; }
  if(shown>0 && shown%RUN===0){
    // a breath: a title card, and every third one is the Smartware idea
    // followed by its own short run of wall photographs
    var isSmart = data.walls.length>0 && (cardi%3===2);
    var c = isSmart ? SMART : CARDS[cardi%CARDS.length];
    cardi++;
    shown++;
    showCard(c, function(){
      if(isSmart){ smartRun(3, function(){ timer=setTimeout(step, 10); }); }
      else { timer=setTimeout(step, 10); }
    });
    return;
  }
  var item=data.scenes[si%data.scenes.length];
  si++; shown++;
  paint(item, data.scenes[si%data.scenes.length]);
  timer=setTimeout(step, HOLD);
}

function smartRun(n, done){
  var left=Math.min(n, data.walls.length);
  (function one(){
    if(!left){ done(); return; }
    var it=data.walls[wi%data.walls.length]; wi++; left--;
    paint(it, data.walls[wi%data.walls.length]);
    setTimeout(one, HOLD);
  })();
}

function boot(rows){
  var d=build(rows||[]);
  if(!d.scenes.length) return false;
  data=d;
  try{ localStorage.setItem(CACHE, JSON.stringify(rows)); }catch(e){}
  document.getElementById('boot').classList.add('gone');
  if(timer) clearTimeout(timer);
  si=wi=shown=0; step();
  return true;
}

// first paint: the cache if we have one, so a slow morning line never shows an
// empty screen; the network then replaces it in place.
try{
  var c=localStorage.getItem(CACHE);
  if(c) boot(JSON.parse(c));
}catch(e){}
pull(function(rows){ if(rows&&rows.length) boot(rows); });

// hourly refresh; a 04:00 reload to shed anything a browser leaks over a week
setInterval(function(){ pull(function(rows){
  if(rows&&rows.length){ var d=build(rows); if(d.scenes.length){ data=d; } }
}); }, 3600000);
setInterval(function(){ var h=new Date().getHours(), m=new Date().getMinutes();
  if(h===4 && m<2) location.reload(); }, 60000);
})();
</script>
</body>
</html>
